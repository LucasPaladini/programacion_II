<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Preparcial2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


<form action="#">
    <div>
        <label for="campo_ingreso"> Ingresar ars: </label>
        <input type="number" id="campo_ingreso" required placeholder="Ingresa de ars">
    </div><br>

    <div>
        <select required id="seleccion">
            <option value="dolar">Dolares</option>
            <option value="euro">Euros</option>
        </select>
    </div><br>

    <div>
        <button onclick="botonCotizacion()" >Enviar</button>
    </div>

    <div>
        <h1 id="campo_texto">""</h1>
    </div><br>

    <div>
        <label for="moneda_nueva">Ingresar nombre: </label>
        <input type="text" id="moneda_nueva" required placeholder="Ingresa el nombre"> <br> <br>
        <label for="moneda_valor">Ingresar valor: </label>
        <input type="number" id="moneda_valor" required placeholder="Ingresa el valor"> <br> <br>
        <button onclick="agregarSeccion()">Botonazo</button>

    </div>

</form>


<script src="script.js" ></script>

</body>
</html>
