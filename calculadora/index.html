<html lang="en">
<head>

    <title>calcu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div name="calculadora" id="calculadora">
    <div name="campoDeTexto" id="campoDeTexto">
        <span id="resultado"></span>
    </div>

    <div name="botonera" id="botonera">

        <div><button id="9" onclick="javascript:agregarNumero();">9</button></div>

        <div><button id="5" onclick="javascript:agregarNumero();">5</button></div>

    </div>
