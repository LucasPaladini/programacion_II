<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contacto</title>
    <link rel="stylesheet" href="css/contact.css">
</head>

<body>

<div class="container">
    <form id="formulario_bienvenida">
        <div>
            <label for="bienvenida">Nombre: </label><br>
            <input type="text" id="bienvenida" required placeholder="Ingresa tu nombre" class="input">
        </div><br>
        <div>
            <label for="Mail">E-mail: </label><br>
            <input type="email" id="Mail" required placeholder="Ingresa tu E-Mail" class="input">
        </div><br>
        <div>
            <label for="Subject">Subject: </label><br>
            <input type="text" id="Subject" required placeholder="Ingresa subject.." class="input">
        </div><br>
        <div>
            <label for="Mensaje">Mensaje: </label><br>
            <textarea id="Mensaje" required class="input-mensaje" ></textarea>
        </div><br>

        <input type="submit" value="Enviar" class="boton-enviar"><br><br>
        <button class="boton-volver" onclick="window.location.href='index.html'">Volver</button>

    </form><br>
</div>


</body>
</html>
